<title>김원장 통증의학과</title>

<style>
/* Layout: EMR-style clinic screen. Waiting room | exam room chart | treatment log. Stacks to one column on phones. */
:root{
  --paper:#eef3f2; --card:#fbfdfc; --ink:#14292c; --muted:#58706f; --line:#d3dfdd;
  --teal:#0b746c; --teal-soft:#d8ece8; --on-teal:#ffffff;
  --coral:#d4533c; --amber:#c98d10; --good:#2e8a4b; --bad:#c03a2a;
  --scrim:rgba(10,25,27,.55); --shadow:0 12px 34px rgba(12,40,40,.14);
  --f-display:'Do Hyeon','IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Malgun Gothic',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d1819; --card:#132325; --ink:#e2eeec; --muted:#8ba5a3; --line:#243a3c;
  --teal:#3bbfb0; --teal-soft:#123532; --on-teal:#06201d;
  --coral:#f07b62; --amber:#f2bf4a; --good:#5ec47e; --bad:#f06a56;
  --scrim:rgba(0,0,0,.65); --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d1819; --card:#132325; --ink:#e2eeec; --muted:#8ba5a3; --line:#243a3c;
  --teal:#3bbfb0; --teal-soft:#123532; --on-teal:#06201d;
  --coral:#f07b62; --amber:#f2bf4a; --good:#5ec47e; --bad:#f06a56;
  --scrim:rgba(0,0,0,.65); --shadow:0 12px 34px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 14px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.btn:hover:not(:disabled){border-color:var(--teal)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--teal);color:var(--on-teal);border-color:var(--teal);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.cross{flex:none;width:38px;height:38px;background:var(--teal);clip-path:polygon(34% 0,66% 0,66% 34%,100% 34%,100% 66%,66% 66%,66% 100%,34% 100%,34% 66%,0 66%,0 34%,34% 34%)}
.brand h1{font-size:28px;line-height:1.1}
.sub{color:var(--muted);font-size:13px}
.sub b{color:var(--teal);font-weight:700}
.nav{display:flex;gap:8px;flex-wrap:wrap}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.stat .v{font-family:var(--f-display);font-size:23px;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:4px}
.neg{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .4s}
.bar i.mid{background:var(--amber)} .bar i.low{background:var(--bad)}
.stars-mini{color:var(--amber);font-size:13px;letter-spacing:1px}

/* main */
.main{display:grid;grid-template-columns:270px minmax(0,1fr) 290px;gap:14px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel>h2{font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel>h2 span{font-family:var(--f-body);font-size:12px;color:var(--muted)}
@media (max-width:1080px){.main{grid-template-columns:250px minmax(0,1fr)}.log{grid-column:1/-1}}
@media (max-width:720px){.main{grid-template-columns:minmax(0,1fr)}.qlist{flex-direction:row!important;overflow-x:auto;padding-bottom:4px}.q{min-width:210px}}

/* queue */
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:grid;grid-template-columns:38px minmax(0,1fr);gap:9px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper);cursor:pointer}
.q:hover{border-color:var(--teal)}
.q.sel{border-color:var(--teal);background:var(--teal-soft)}
.q .av{font-size:26px;line-height:1;text-align:center}
.q .info{min-width:0;display:flex;flex-direction:column;gap:3px}
.q .info>span{display:block}
.q .bar{display:block;height:4px;margin-top:2px}
.q .bar i{display:block}
.q .nm{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.q .nm em{font-style:normal;font-weight:400;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.q .cc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--muted);font-size:13px;padding:10px 2px}
.upcoming{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}

/* room */
.room{min-height:420px}
.chart-head{display:flex;gap:14px;align-items:center}
.avatar{font-size:46px;line-height:1;width:64px;height:64px;display:grid;place-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;flex:none}
.who{min-width:0;display:flex;flex-direction:column;gap:5px}
.who .name{font-family:var(--f-display);font-size:24px;line-height:1.1}
.who .name small{font-family:var(--f-body);font-size:13px;color:var(--muted);margin-left:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--muted)}
.tag.ok{border-color:var(--good);color:var(--good)}
.tag.vip{border-color:var(--amber);color:var(--amber);font-weight:700}
.tag.warn{border-color:var(--bad);color:var(--bad)}
.cc-quote{margin:0;font-size:17px;line-height:1.5;padding:12px 14px;background:var(--paper);border-radius:10px;border-left:3px solid var(--teal)}
.vas-wrap{display:flex;flex-direction:column;gap:5px}
.vas-lbl{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.vas-lbl b{font-family:var(--f-mono);color:var(--ink);font-size:13px}
.vas{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.vas i{height:10px;border-radius:2px;background:var(--line)}
.vas i.g{background:var(--good)} .vas i.a{background:var(--amber)} .vas i.c{background:var(--coral)}
.findings h3,.tx-h{font-size:15px;color:var(--muted)}
.findings ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.dx-line{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;border:1px dashed var(--line);border-radius:10px;padding:9px 12px}
.dx-line .dx{font-weight:700}
.dx-line .unk{color:var(--muted);font-weight:400}
.tx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.tx{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);cursor:pointer;transition:border-color .15s,transform .15s}
.tx:hover:not(:disabled){border-color:var(--teal);transform:translateY(-1px)}
.tx:disabled{opacity:.42;cursor:not-allowed}
.tx .t{font-weight:700;font-size:13.5px}
.tx .m{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tx .n{font-size:11.5px;color:var(--muted)}
.tx .n.lock{color:var(--bad)}
.tx.nc .t::after{content:"비급여";font-family:var(--f-body);font-weight:500;font-size:10px;color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:0 5px;margin-left:5px;vertical-align:2px}
.tx.ref{border-style:dashed}
.room-empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:20px 4px}
.room-empty p{margin:0;color:var(--muted);max-width:46ch}
.banner{font-size:13px;padding:8px 12px;border-radius:9px;background:var(--teal-soft);color:var(--ink)}
.banner.warn{background:transparent;border:1px solid var(--bad);color:var(--bad)}

/* result */
.result{display:flex;flex-direction:column;gap:12px;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.r-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.r-stars{font-size:30px;color:var(--amber);letter-spacing:2px}
.r-stars .off{color:var(--line)}
.r-money{font-family:var(--f-display);font-size:28px;color:var(--good)}
.r-name{font-family:var(--f-display);font-size:20px}
.vas-change{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.vas-change .arrow{font-family:var(--f-mono);color:var(--muted)}
.review{margin:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.review cite{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:4px}
.answer{font-size:13px;background:var(--paper);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.answer b{color:var(--teal)}

/* log */
.loglist{display:flex;flex-direction:column;gap:0;max-height:560px;overflow-y:auto}
.le{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.le:last-child{border-bottom:0}
.le .tm{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-top:1px}
.le .good{color:var(--good)} .le .bad{color:var(--bad)} .le .st{color:var(--amber)}

/* modal */
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:600px;max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px;animation:pop .3s ease}
.modal.wide{max-width:760px}
.modal h2{font-size:26px}
.modal p{margin:0}
.modal .lead{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts .btn{text-align:left;padding:11px 14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
.field input{font:inherit;font-size:16px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.sumgrid .stat .v{font-size:21px}
table.ledger{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.ledger td{padding:5px 0;border-bottom:1px solid var(--line)}
table.ledger td:last-child{text-align:right;font-family:var(--f-mono);font-size:12.5px}
table.ledger tr.total td{font-weight:700;border-bottom:0;padding-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs .btn[aria-pressed="true"]{background:var(--teal-soft);border-color:var(--teal);font-weight:700}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.item h3{font-size:17px}
.item p{font-size:12.5px;color:var(--muted);flex:1}
.item .price{font-family:var(--f-mono);font-size:12.5px}
.item .own{color:var(--good);font-weight:700;font-size:13px}
.item .ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.item .cnt{font-family:var(--f-mono);font-size:13px;min-width:40px}
.help h3{font-size:17px;margin-top:4px}
.help ul{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 12px));display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:20px;font-size:13.5px;box-shadow:var(--shadow);animation:pop .25s ease;text-align:center}
.tag.re{border-color:var(--teal);color:var(--teal);font-weight:700}
.re-mark{font-size:10.5px;color:var(--teal);border:1px solid var(--teal);border-radius:8px;padding:0 4px;font-weight:500}
.history{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.history h3{font-size:15px;color:var(--muted)}
.hv{font-size:13px;display:flex;flex-direction:column;gap:2px;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.hv-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hv-top span{color:var(--muted);font-size:12px}
.hv .st{color:var(--amber)}
.hv ol{margin:2px 0;padding-left:20px}
.hv-vas{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.history .now{margin:0;font-size:13px}
.history .unk{color:var(--muted)}
.todo{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo legend{font-size:12px;color:var(--muted);padding:0;margin-bottom:5px}
.todo legend small{margin-left:6px}
.todo-row{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center}
.todo-row .num{font-family:var(--f-display);font-size:18px;color:var(--teal);text-align:center}
.tag.cons,.re-mark.cons{border-color:var(--amber);color:var(--amber)}
.xray-box{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px}
.xray-box canvas{width:100%;max-width:220px;aspect-ratio:1;border-radius:6px;background:#000;display:block}
.xray-box h3{font-size:15px}
.xray-box p{margin:4px 0 0;font-size:13.5px}
@media (max-width:520px){.xray-box{grid-template-columns:minmax(0,1fr)}}
.scene{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.scene-wrap{position:relative;width:100%;max-width:780px;margin:0 auto;aspect-ratio:320/150}
.scene canvas{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:6px}
.sl{position:absolute;font-size:10px;line-height:1.1;padding:2px 4px;border-radius:3px;background:rgba(20,40,44,.72);color:#fff;pointer-events:none;white-space:nowrap}
@media (max-width:520px){.sl{font-size:8.5px;padding:1px 3px}}
.le .assoc{font-size:10.5px;color:var(--teal);border:1px solid var(--teal);border-radius:8px;padding:0 4px}
.auto-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.auto-log thead td{font-size:11.5px;color:var(--muted)}
.auto-log td{padding-right:10px;white-space:nowrap}
.tx[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
.tx[aria-pressed="true"] .t::before{content:"✓ ";color:var(--teal)}
.tx-done{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;bottom:max(8px,env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--teal);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);z-index:5}
.tx-done span{min-width:0;font-size:13.5px}
.tx-done .unk{color:var(--muted)}
.ddx{display:flex;flex-direction:column;gap:8px}
.ddx-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chip .rank{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--on-teal);color:var(--teal);font-size:11px;margin-right:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 11px;cursor:pointer}
.chip:hover:not(:disabled){border-color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal);font-weight:700}
.chip.again{border-style:dashed;border-color:var(--teal);color:var(--teal)}
.shot *{animation:none!important;transition:none!important}.shot .mode-note,.shot .toasts{display:none!important}
.shot-room .stats,.shot-room .scene,.shot-room .queue,.shot-room .log,.shot-room .nav{display:none!important}
.shot-tx .cc-quote,.shot-tx .vas-wrap,.shot-tx .xray-box,.shot-tx .findings,.shot-tx .chart-head{display:none!important}
.btn.ic{padding:8px 10px;line-height:1}
.office-wrap{flex:none;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.office-wrap canvas{display:block;width:100%;aspect-ratio:240/135;image-rendering:pixelated}
.art-item canvas{width:100%;max-width:160px;aspect-ratio:120/92;image-rendering:pixelated;border-radius:4px;align-self:center}
.g{font-size:11.5px;border-radius:8px;padding:0 6px;border:1px solid}
.g-c{color:#8a5a32;border-color:#8a5a32}.g-r{color:var(--muted);border-color:var(--muted)}.g-m{color:var(--amber);border-color:var(--amber)}
.up{color:var(--good)}
.spark{width:100%;height:30px;display:block}
.modal.still{animation:none}
.modeh{font-size:16px;margin:6px 0 0}.modeh small{font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:6px;font-weight:400}
.rank-me{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rank-list{display:flex;flex-direction:column;gap:4px}
.rank-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px}
.rank-row.me{border-color:var(--teal);background:var(--teal-soft)}
.rank-row .no{font-family:var(--f-mono);font-weight:700;text-align:center}
.rank-row .nw{font-family:var(--f-mono)}
.rank-row small{color:var(--muted)}
.chip.dim{opacity:.45;text-decoration:line-through}
.lvbtn{font:inherit;color:inherit;background:none;border:0;border-bottom:1px dashed currentColor;padding:0;cursor:pointer}
.perks{display:flex;flex-direction:column;gap:6px}

function ddxScore(p){const C=(DDX[p.dx]||[]).slice(0,3),W=[60,25,15];let s=0;
  (p.picks||[]).slice(0,3).forEach((x,i)=>{if(C[i]===x)s+=W[i];else if(C.includes(x))s+=W[i]*.5;});return Math.round(s);}

/* 결과 등급: S(별 5 + 진단 1순위 맞힘) · A(별 4 이상) · B(별 3) · C(그 이하) */
function vipReward(p,stars,ddx){
  const v=VIPMAP[p.vipCase],g=stars>=5&&ddx>=60?'S':stars>=4?'A':stars>=3?'B':'C';
  const money=Math.round(({S:1e8,A:4e7,B:1e7,C:0})[g]*v.mult*(hasPerk('vip')?1.5:1)/1e6)*1e6;state.money+=money;
  const out=[];if(money)out.push(`사례비 ${won(money)}`);
  if(g==='S'||g==='A'){state.rating=clamp(state.rating+(g==='S'?.08:.04),1,5);out.push(`평점 +${g==='S'?'0.08':'0.04'}`);
    if(v.perk==='fans'){const n=g==='S'?8:4;addMod(n,10,`${v.title} 입소문`);out.push(`10일 동안 하루 환자 +${n}명`);}
    if(v.perk==='sponsor'){const amt=g==='S'?3e6:15e5,days=g==='S'?30:20;state.sponsor={name:v.title,amt,until:state.day+days};out.push(`${days}일 동안 매일 주치의 계약금 ${won(amt)}`);}

function genArrivals(){

  const n=Math.max(patientCount(T),due.length+2);
  const hasLunch=!T.lunchDone&&T.close>840;
  const span=(T.close-T.open)-(hasLunch?60:0)-40;
  const times=[];
  for(let i=0;i<n;i++){let off=Math.floor(Math.pow(Math.random(),1.2)*span);let t=T.open+off;if(hasLunch&&t>=780)t+=60;times.push(t);}
  times.sort((a,b)=>a-b);if(times.length)times[0]=T.open;
  const pts=due.map(r=>makeReturn(r,T));while(pts.length<times.length)pts.push(genPatient(0,T));

function assocPick(p){
  const d=DXMAP[p.dx];
  if(d.flag)return Math.random()<.8?'refer':'med';
  const pool=p.conservative?['pt','med']:Object.entries(d.eff).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(k=>k!=='refer');
  const ok=pool.filter(k=>!txBlock(k));
  return (Math.random()<.3&&ok[1]?ok[1]:ok[0])||'med';
}
function runAssociates(){
  const T=state.today,n=state.staff.assoc||0;if(!n||!T)return;
  if(!Array.isArray(T.assocFree)||T.assocFree.length!==n)T.assocFree=Array.from({length:n},(_,i)=>(T.assocFree||[])[i]||T.open);
  let guard=0;
  while(guard++<60){
    const i=T.assocFree.indexOf(Math.min(...T.assocFree));
    const cand=T.queue.filter(p=>p.id!==T.sel&&!p.vipCase&&(state.auto||!p.vip)).sort((a,b)=>a.arrive-b.arrive)[0];
    if(!cand)break;
    const start=Math.max(T.assocFree[i],cand.arrive);
    if(start>T.time)break;
    const tid=assocPick(cand),t=TX[tid],d=DXMAP[cand.dx],eff=effOf(d,tid);
    const score=eff*(hasPerk('assoc')?.92:.8)+R(-.7,.4);
    resolveVisit(cand,{tids:[tid],score,over:!d.flag&&!t.cov&&t.price>=80000*PRICE_X&&eff<=1,flagHandled:tid==='refer',assoc:true,at:start});
    T.assocFree[i]=start+Math.round(visitTime([tid])*.7)+2;
  }
}
/* 빠른 선택: 여러 치료를 묶어서 한 번에 진료. 가장 잘 듣는 치료 + 나머지는 보조 효과 */
function treatMulti(tids){
  const p=cur();if(!p)return;
  tids=[...new Set(tids)].filter(k=>TX[k]&&!txBlock(k)).slice(0,3);if(!tids.length)return;
  const d=DXMAP[p.dx];
  const effs=tids.map(k=>effOf(d,k)).sort((a,b)=>b-a);
  let score=effs[0]+.3*Math.max(0,effs[1]||0)+.15*Math.max(0,effs[2]||0);
  score=Math.min(score,3.4)+ddxScore(p)/100*.4+(tids.some(k=>TX[k].inj&&k!=='nerve')&&state.owned.us?.3:0)+skillBonus()+R(-.5,.5);
  const over=!d.flag&&tids.some(k=>!TX[k].cov&&TX[k].price>=80000*PRICE_X&&effOf(d,k)<=1);
  p.txSel=[];
  resolveVisit(p,{tids,score,over,flagHandled:tids.includes('refer')});
}
function treat(tid){
  const p=cur();if(!p||txBlock(tid))return;
  const t=TX[tid],d=DXMAP[p.dx],eff=effOf(d,tid);

function buildPrompt(p,dx,tx){
  const d=DXMAP[p.dx];

[환자]

${(p.history||[]).map(h=>`- 이전 진료 (${state.day-h.day}일 전): 진단 "${h.dx||'기록 없음'}", 시행 ${h.tx.join(' / ')}, ${h.referOnly?'상급병원 의뢰':`치료 직후 VAS ${h.before}→${h.after}`}`).join('\n')}

[게임 내부 참고 라벨] ${d.name}
이 라벨은 게임이 증상을 만들 때 쓴 것일 뿐 정답이 아니다. 같은 소견에서 임상적으로 타당한 다른 진단(감별진단 포함)을 내렸다면 그 타당성만큼 인정하라.
입력 방식: 플레이어는 게임으로 빠르게 진료하므로 짧은 약어(HIVD, OA, TFESI, MBB, TPI, NSAIDs 등)나 한두 단어로 적는다. 부위·좌우·레벨·용량을 생략해도 감점하지 말고, 의도가 임상적으로 맞으면 충분히 인정하라.
채점 강도: 후하게 채점하라. 진단의 큰 범주와 치료 방향이 맞으면 dxScore·txScore 모두 85~100점을 줘라. 방향은 맞는데 최선은 아니면 70~85점. 명백히 틀렸거나 환자에게 해가 될 때(레드 플래그를 놓친 경우 등)만 50점 아래로 줘라. 설명이 짧거나 세부가 빠진 것, 추가 검사·교육·생활지도를 적지 않은 것은 감점 사유가 아니다.
이 게임의 진료 관점: 척추 주위(목·등·허리) 근육의 축성 통증은 근막통증증후군보다 디스크성(추간판성) 통증으로 본다. 사지의 힘줄염·건병증은 별개의 진단으로 인정한다.
신경학적 결손 규칙: 근력 저하나 감각 저하가 있으면 환자가 주호소에서 먼저 말한다. 주호소와 진찰 소견에 근력·감각 저하가 없으면 신경학적 결손이 없는 것으로 간주하라. 이 경우 신경학적 검사를 적지 않았거나 MRI 등 정밀검사를 처방하지 않았다는 이유로 감점하지 말고, 피드백에서도 그것을 아쉬운 점으로 지적하지 말라.${d.flag?' 이 환자에게는 응급·악성·감염 등 레드 플래그 소견이 있다.':''}

[이 의원에서 지금 가능한 것] ${equipText()}
장비나 인력이 없어 할 수 없는 시술을 처방했으면 feasible을 false로 하고 그 시술은 usedTreatments에서 빼라. 다만 같은 목적을 가능한 장비로 하는 방법(예: C-arm 대신 초음파 유도 시술)은 정당한 대안으로 인정하라.

[플레이어 입력]
진단: ${dx||'(비워둠)'}
오늘 할 일 (번호는 순서와 무관):
${tx.map((x,i)=>`${i+1}. ${x}`).join('\n')}

[채점 항목]
- dxScore: 진단은 게임이 객관식 순위(감별진단 순서)로 따로 채점하니 0을 넣어라. 플레이어의 진단 순위는 치료 계획을 이해하는 참고로만 써라.
- txScore (0~100): 이 환자와 이 의원 여건에서 치료 계획의 적절성과 기대 효과. 레드 플래그를 놓치고 시술만 하면 0~10. 재진이면 이전 치료 반응을 반영하라: 잘 들은 치료를 반복하거나 이어가는 것은 타당하고, 효과 없던 치료를 그대로 반복하면 감점, 반응이 부족하면 단계적으로 치료를 바꾸거나 올린 것을 높게 평가하라.
- usedTreatments: 실제 시행하는 치료·검사를 아래 키로 최대 4개 (가장 가까운 것으로 매핑). xray=X-ray 촬영, med=약 처방, pt=물리치료, manual=도수치료, eswt=체외충격파, tpi=통증유발점 주사, joint=관절강·점액낭 주사, prolo=프롤로·증식치료 주사, nerve=초음파 유도 신경차단(견갑상신경·후두신경·말초신경 차단, 초음파 유도 경추 시술), tfeb=C-arm 경추간공 경막외 차단술(TFEB, TFESI), root=C-arm 선택적 신경근 차단술(root block, SNRB), psoas=C-arm 요근구획 차단술(psoas compartment block, 요신경총 차단), mbb=C-arm 내측지 차단술·후관절 차단술(MBB, facet block), epi=C-arm 추궁간 경막외 차단술(ILEB, interlaminar)·미추 경막외, rf=고주파 열응고술, refer=상급병원·응급실 전원 또는 즉시 MRI 등 정밀검사 의뢰
- referred: 전원이나 즉시 정밀검사 의뢰가 포함되면 true
- overtreatment: 근거가 약한 비싼 비급여 치료를 끼워 넣었거나 치료를 과하게 겹쳤으면 true
- feasible: 처방한 것을 이 의원에서 모두 할 수 있으면 true
- feedback: 한국어 1~2문장, 짧게. 동료 전문의에게 말하듯 잘한 점 위주로, 정말 중요한 것만 덧붙여라.
- best: 이 환자에게 이 의원에서 권할 1차 치료 한 줄 (한국어). 고주파 열응고술은 요즘 이 의원에서 거의 하지 않으니 best에 넣지 말라.

JSON 객체 하나만 답하라. 예: {"dxScore":80,"txScore":75,"usedTreatments":["nerve","med"],"referred":false,"overtreatment":false,"feasible":true,"feedback":"...","best":"..."}`;

function aiErrText(e){const c=e&&e.code;
  if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed')return'이 화면에서는 AI 채점을 쓸 수 없어요. 빠른 선택 모드로 진료해 주세요.';
  if(c==='rate_limited')return'AI 채점 요청이 많아요. 잠시 뒤에 다시 눌러주세요.';
  if(c==='session_expired')return'로그인이 만료됐어요. 다시 로그인한 뒤 눌러주세요.';
  if(c==='invalid_json')return'채점 결과를 읽지 못했어요. 한 번 더 눌러주세요.';
  if(c==='refused')return'이 입력은 채점할 수 없어요. 진단과 치료 계획을 다시 적어주세요.';
  return'채점 중 연결이 끊겼어요. 한 번 더 눌러주세요.';}
async function aiTreat(){
  const T=state.today,p=cur();if(!p||!sampleFn||T.grading)return;
  const dx=(p.picks||[]).map((x,i)=>`${i+1}순위 ${x}`).join(', '),tx=(p.draftTxs||[]).map(s=>String(s||'').trim()).filter(Boolean);
  if(!tx.length){T.aiError='오늘 할 일을 하나 이상 적어주세요.';render();return;}
  T.grading=p.id;T.aiError='';render();
  aiCtl=new AbortController();
  try{
    const r=await sampleFn.json(buildPrompt(p,dx,tx),{signal:aiCtl.signal,cache:false});
    if(state.today!==T||T.grading!==p.id)return;
    T.grading=null;applyAi(p,dx,tx,r||{});
  }catch(e){
    if(state.today!==T)return;
    T.grading=null;
    if(!(e&&e.code==='cancelled'))T.aiError=aiErrText(e);
    if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)){sampleFn=null;sampleState='none';state.mode='quick';}
  }
  save();render();
}
function applyAi(p,dx,tx,r){
  const d=DXMAP[p.dx];
  const ds=ddxScore(p),ts=Math.round(clamp(+r.txScore||0,0,100));
  let tids=[...new Set((Array.isArray(r.usedTreatments)?r.usedTreatments:[]).map(String).filter(k=>TX[k]))].slice(0,4);
  const blocked=tids.filter(k=>txBlock(k));
  tids=tids.filter(k=>!txBlock(k));
  if(!tids.length)tids=['med'];
  let score=(ds*.35+ts*.65)/100*3.2-.1+skillBonus()+R(-.4,.4);
  if(blocked.length)score=Math.min(score,1.2);
  else if(r.feasible===false)score-=.4;
  resolveVisit(p,{tids,score,over:!d.flag&&!!r.overtreatment,flagHandled:!!r.referred||tids.includes('refer'),
    ai:{dx,tx,ds,ts,feedback:String(r.feedback||''),best:String(r.best||''),blocked}});
}

function onBack(){

  if(T&&T.grading)return;
  if(m&&m.type==='exitAsk'){NativeApp.A&&NativeApp.A.exitApp();return;}

async function showRewarded(){
  const A=Ads.A;if(!A||Ads.busy)return false;Ads.busy=true;let got=false;const hs=[];
  try{
    hs.push(await A.addListener('onRewardedVideoAdReward',()=>{got=true;}));
    const closed=new Promise(res=>{A.addListener('onRewardedVideoAdDismissed',res).then(h=>hs.push(h));A.addListener('onRewardedVideoAdFailedToShow',res).then(h=>hs.push(h));});
    await A.prepareRewardVideoAd({adId:AD_CFG.rewardId,isTesting:AD_CFG.testing});
    const item=await A.showRewardVideoAd();if(item&&item.amount!=null)got=true;
    await Promise.race([closed,new Promise(r=>setTimeout(r,1500))]);
  }catch(e){toast('광고를 불러오지 못했어요. 잠시 뒤에 다시 해주세요.');}
  hs.forEach(h=>{try{h.remove();}catch(e){}});Ads.busy=false;return got;
}
const AD_CASH=3e6,AD_REVIVE=5e7;
function adUses(){if(!state.adUses||state.adUses.day!==state.day)state.adUses={day:state.day,fatigue:0,cash:0,double:0};return state.adUses;}
const REWARDS={cash:{label:`운영 자금 +${won(AD_CASH)}`,max:3}};
async function watchAd(kind){
  const ok=await showRewarded();if(!ok){render();return;}
  const u=adUses();
  if(kind==='fatigue'){u.fatigue++;state.fatigue=Math.min(maxFat(),state.fatigue+30);toast('체력 +30 회복!');}
  if(kind==='cash'){u.cash++;state.money+=AD_CASH;toast(`운영 자금 +${won(AD_CASH)}`);}
  if(kind==='double'){const net=state.today&&state.today.summary?state.today.summary.net:0;const b=Math.min(Math.max(0,net),5e6);u.double++;state.money+=b;toast(`보너스 +${won(b)}`);}
  sfx('level');
  if(kind==='revive'){state.reviveUsed=true;state.money+=AD_REVIVE;state.modal={type:'summary'};toast(`긴급 자금 +${won(AD_REVIVE)}. 다시 힘내봐요!`);}
  save();render();
}

function autoTick(){
  /* 취미 미니게임 중에도 자동 운영은 계속 돌아가요 (미니게임 창은 #app 밖에 있어서 다시 그려져도 안전) */
  if(!state||!state.auto||state.autoPaused||(pointerDown&&!HB.el)||Ads.busy||vipActive())return;
  const T=state.today;if(!T)return;
  if(state.modal){if(state.modal.type!=='event')return;
    const e=EVENTS.find(x=>x.id===state.modal.id);toast(`[아침 일정] ${val(e.title)} → ${val(e.opts[0].label)}`);chooseEvent(0);save();render();return;}
  if(T.ended){nextDay();save();render();return;}
  if(T.time>=T.close){
    endDay();const S=T.summary;
    state.autoLog=(state.autoLog||[]).concat([{day:state.day,dow:DOW[dowOf(state.day)],served:T.served,lost:T.lost,revenue:T.revenue,net:S.net}]).slice(-14);
    if(state.modal&&state.modal.type==='gameover'){state.auto=false;}
    else{state.modal=null;if(S.newTitle)toast(`새 칭호: ${S.newTitle}`);}
    save();render();return;}
  T.sel=null;T.result=null;
  advance(Math.min(8*(state.autoSpeed||1),Math.max(1,T.close-T.time)));
  render();
}

function openOverlay(type){state.modalBack=state.modal&&state.modal.type!==type?state.modal:null;state.modal={type};}
function act(a,arg){
  const T=state.today;
  if(T&&T.grading&&!['shop','help','close','shoptab','cancelai'].includes(a))return;
  switch(a){
    case'music':{state.audio=state.audio||{music:true,sfx:true};state.audio.music=!state.audio.music;if(state.audio.music){audioUnlock();musicStart();}else musicStop();break;}
    case'sfxtoggle':state.audio=state.audio||{music:true,sfx:true};state.audio.sfx=!state.audio.sfx;break;
    case'office':ensureOffice();openOverlay('office');break;
    case'otab':state.officeTab=arg;break;
    case'perks':openOverlay('perks');break;
    case'rank':ensureInv();ensureOffice();openOverlay('rank');if(rankOn()&&isBiz()&&(!Rank.list||Date.now()-Rank.at>6e4))rankFetch();break;
    case'rankref':rankFetch();break;
    case'ranknick':{const v=((document.getElementById('rank-nick')||{}).value||'').trim().slice(0,12);if(v.length<2){toast('닉네임은 2자 이상으로 해주세요.');break;}rankSaveLocal({nick:v});toast('닉네임을 저장했어요. 랭킹에 올릴게요!');rankFetch();break;}
    case'vipgo':{if(state.modal&&state.modal.type==='vipIntro'){state.modal=null;if(T){T.pending=false;genArrivals();vipSpawn();}}break;}
    case'hobby':ensureHobby();openOverlay('hobby');break;
    case'hplay':{if(arg==='golf'&&(ensureHobby().golfDay===state.day||state.money<GOLF_FEE))break;if(arg==='fish'&&castsLeft()<=0)break;
      if((arg==='concert'||String(arg).startsWith('piano'))&&!hasPiano())break;
      hobbyOpen(arg==='golf'||arg==='fish'?arg:'piano',arg==='concert'?'concert':String(arg).split(':')[1]);break;}
    case'exitapp':save();if(NativeApp.A)NativeApp.A.exitApp();return;
    case'invest':ensureInv();state.bldSellAsk=false;openOverlay('invest');break;
    case'invtab':state.invTab=arg;state.bldSellAsk=false;break;
    case'sbuy':{const[id,a]=arg.split(':');if(SMAP[id]&&state.money>=+a)buyStock(id,+a);break;}
    case'ssell':{const[id,f]=arg.split(':');if(SMAP[id])sellStock(id,Math.min(1,+f));break;}
    case'dca':{const[id,a]=arg.split(':');ensureInv();if(SMAP[id]){state.inv.dca[id]=+a;toast(+a?`${SMAP[id].name}: 매주 월요일 ${won(+a)}씩 자동 매수`:`${SMAP[id].name} 자동 매수를 껐어요.`);}break;}
    case'dep':{const[t,a]=arg.split(':');openDeposit(t,+a);break;}
    case'dclose':{const got=closeDeposit(+arg,true);if(got)toast(`중도 해지: ${won(got)}을 돌려받았어요.`);break;}
    case'bfloor':{ensureInv();const B=state.bld,p=floorPrice();if(!B.floor&&!B.own&&state.money>=p){state.money-=p;B.floor=true;sfx('buy');toast('3층을 매입했어요. 이제 임대료가 없어요!');log(`<b>3층 매입</b> (-${won(p)})`);}break;}
    case'bbuy':{ensureInv();if(buyBuilding(1,arg==='loan')){sfx('level');toast(`${BLD_NAME}의 건물주가 됐어요! 빈 층에 세입자를 들여보세요.`);}break;}
    case'bten':{const B=state.bld,[f,i]=arg.split(':').map(Number),o=(B.offers[f]||[])[i];if(B.own&&o&&!B.ten[f]&&!hasTen(o.k)){B.ten[f]=o;delete B.offers[f];if(o.k==='pharm')state.pharmacy=true;sfx('buy');toast(`${f}층에 ${TENANTS[o.k].name} 입주!`);}break;}
    case'bevict':{const B=state.bld,f=+arg,t=B.ten[f];if(t){B.ten[f]=null;B.offers[f]=rollOffers(f);if(t.k==='pharm'&&!state.evtUsed.pharmacy)state.pharmacy=false;toast(`${f}층 ${TENANTS[t.k].name}이(가) 나갔어요.`);}break;}
    case'bmort':{const B=state.bld,amt=arg==='all'?B.mort:Math.min(+arg,B.mort);if(amt>0&&state.money>=amt){state.money-=amt;B.mort-=amt;toast(`담보대출 ${won(amt)} 상환`);}break;}
    case'brefi':{const B=state.bld;if(B.own&&B.mort+1e8<=B.value*MORT_LTV){B.mort+=1e8;state.money+=1e8;toast('건물 담보로 1억을 더 빌렸어요.');}break;}
    case'xbuy':{ensureInv();const[id,how]=arg.split(':');buyExtra(+id,how==='loan');break;}
    case'xrepay':{const e=state.bld.extra.find(x=>x.id===+arg);if(e&&state.money>=e.mort){state.money-=e.mort;toast(`${e.name} 대출 ${won(e.mort)} 상환`);e.mort=0;}break;}
    case'xsell':{const B=state.bld,e=B.extra.find(x=>x.id===+arg);if(e){const got=Math.round(e.value*.97)-e.mort;state.money+=got;B.extra=B.extra.filter(x=>x!==e);sfx('coin');toast(`${e.name}을(를) 팔아 ${won(got)}을 받았어요.`);log(`🏙 ${e.name} 매각 (${won(got)})`);}break;}
    case'bsellask':state.bldSellAsk=true;break;
    case'bsellno':state.bldSellAsk=false;break;
    case'bsell':{const B=state.bld;if(B.own){const got=Math.round(B.value*.97)-B.mort;state.money+=got;log(`<b>${BLD_NAME}</b> 매각 (${won(got)})`);
      if(hasTen('pharm')&&!state.evtUsed.pharmacy)state.pharmacy=false;B.own=false;B.floor=false;B.ten={};B.offers={};B.mort=0;state.bldSellAsk=false;sfx('coin');toast(`건물을 팔아 ${won(got)}을 손에 쥐었어요.`);}break;}
    case'fbuy':{const f=FURN.find(x=>x.k===arg);ensureOffice();if(f&&!state.office.furn[f.k]&&state.money>=f.cost){state.money-=f.cost;state.office.furn[f.k]=true;sfx('buy');toast(`${f.name}을(를) 원장실에 들였어요.`);}break;}
    case'abuy':{ensureOffice();const it=state.auction.items.find(x=>x.id===arg);if(it&&state.money>=it.price&&!ownsArt(arg)){state.money-=it.price;state.office.art.push({id:arg,paid:it.price});
      state.auction.items=state.auction.items.filter(x=>x.id!==arg);if(state.office.wall.length<3)state.office.wall.push(arg);sfx('buy');toast(`「${ARTMAP[arg].title}」 낙찰!`);}break;}
    case'asell':{const o=state.office,x=o.art.find(y=>y.id===arg);if(x){const v=Math.round(artValue(arg)*.9/1e4)*1e4;state.money+=v;o.art=o.art.filter(y=>y.id!==arg);o.wall=o.wall.filter(y=>y!==arg);if(o.lobby===arg)o.lobby=null;sfx('coin');toast(`${won(v)}에 팔았어요.`);}break;}
    case'ahang':{const o=state.office;if(o.wall.includes(arg))o.wall=o.wall.filter(y=>y!==arg);else if(o.wall.length<3)o.wall.push(arg);else toast('원장실 벽에는 3점까지 걸 수 있어요.');break;}
    case'alobby':{const o=state.office;o.lobby=o.lobby===arg?null:arg;break;}
    case'mode':state.mode=arg==='quick'?'quick':'ai';if(T)T.aiError='';break;
    case'ai':aiTreat();return;
    case'ddx':{const p=cur();if(p){const L=p.picks||[];const i=L.indexOf(arg);if(i>=0)L.splice(i,1);else if(L.length<3)L.push(arg);p.picks=L;}break;}
    case'ddxclear':{const p=cur();if(p)p.picks=[];break;}
    case'chip':{const p=cur();if(p)toggleChip(p,TX_CHIPS[+arg]);if(T)T.aiError='';break;}
    case'chipagain':{const p=cur();const h=p&&(p.history||[])[p.history.length-1];if(h){const l=h.tx.slice(0,3);while(l.length<3)l.push('');p.draftTxs=l;if(!(p.picks||[]).length&&h.picks)p.picks=[...h.picks];}break;}
    case'cancelai':if(aiCtl)aiCtl.abort();if(T)T.grading=null;break;
    case'sel':if(T&&!T.result&&!state.auto)T.sel=+arg;break;
    case'exam':exam();break;
    case'tx':treat(arg);break;
    case'txsel':{const p=cur();if(p){const L=p.txSel||[];const i=L.indexOf(arg);if(i>=0)L.splice(i,1);else if(L.length<3&&!txBlock(arg))L.push(arg);else if(L.length>=3)toast('치료는 최대 3개까지 고를 수 있어요.');p.txSel=L;}break;}
    case'txdone':{const p=cur();if(p&&(p.txSel||[]).length)treatMulti(p.txSel);break;}
    case'next':nextPatient();break;
    case'wait':waitNext();break;
    case'endday':endDay();break;
    case'nextday':nextDay();break;
    case'start':{const v=(document.getElementById('clinic-name')||{}).value;state.clinic=(v&&v.trim())||'김원장 통증의학과';state.modal=null;break;}
    case'evt':chooseEvent(+arg);break;
    case'auto':{if(state.auto){state.auto=false;toast('자동 운영을 껐어요. 원장님이 직접 진료해요.');}
      else if(!(state.staff.assoc>0)){toast('부원장을 1명 이상 채용해야 자동 운영을 켤 수 있어요.');}
      else{state.auto=true;state.autoPaused=false;if(T){T.sel=null;T.result=null;}toast('자동 운영을 시작해요. 부원장들이 진료해요.');}break;}
    case'autopause':state.autoPaused=!state.autoPaused;break;

    case'restart':newGame(state.clinic,state.diff);state.modal={type:'intro'};break;
    case'diff':{const v=(document.getElementById('clinic-name')||{}).value;newGame((v&&v.trim())||state.clinic,arg);state.modal={type:'intro'};break;}
    case'shoptab':state.shopTab=arg;break;
    case'buy':{const e=EQUIP.find(x=>x.k===arg);const n=state.owned[e.k]||0;
      if(state.money>=e.cost&&(e.max?n<e.max:!n)){state.money-=e.cost;state.owned[e.k]=e.max?n+1:true;sfx('buy');toast(`${e.name} 도입 완료!`);log(`<b>${e.name}</b> 도입 (-${won(e.cost)})`);}break;}
    case'hire':{const e=STAFF.find(x=>x.k===arg);if(state.staff[e.k]<e.max){state.staff[e.k]++;sfx('buy');toast(`${e.name} 1명을 채용했어요.`);}break;}
    case'fire':{const e=STAFF.find(x=>x.k===arg);if(state.staff[e.k]>e.min){state.staff[e.k]--;toast(`${e.name} 인원을 줄였어요.`);}break;}
    case'grow':{const g=GROW[arg];const c=g.costs[state[arg]];if(c!==undefined&&state.money>=c){state.money-=c;state[arg]++;sfx('buy');toast(`${g.name} ${state[arg]}단계!`);}break;}
    case'repay':{const amt=Math.min(+arg,state.loan);if(state.money>=amt){state.money-=amt;state.loan-=amt;toast(`대출 ${won(amt)} 상환`);
      if(state.loan<=0&&!state.loanDone){state.loanDone=true;state.modalBack=null;state.modal={type:'loanDone'};}}break;}

}

 lumbar:{r:'lspine',txt:'L4-5 추간판 간격 경도 감소',f:{narrow:'L4'}},

function sceneLoop(ts){const dt=Math.min(.05,(ts-(scene.last||ts))/1000);scene.last=ts;scene.t+=dt;
  if(state&&state.modal&&state.modal.type==='office'&&state.office){const ocv=document.getElementById('office-cv');if(ocv)drawOffice(ocv,dt);}
  if(state&&state.today){[scene.doc,...scene.staff,...scene.ps.values()].forEach(sp=>sp&&stepSprite(sp,dt));
    scene.ps.forEach((sp,id)=>{if(sp.gone)scene.ps.delete(id);});drawScene();}
  requestAnimationFrame(sceneLoop);}
function sceneSync(){
  const T=state&&state.today;if(!scene.cv||!T)return;
  if(scene.owner!==state){scene.owner=state;scene.day=null;scene.sig='';}
  if(scene.day!==state.day){scene.ps.clear();scene.slots.fill(null);scene.day=state.day;}
  const sig=JSON.stringify([state.staff,state.owned,state.office&&state.office.lobby]);
  if(sig!==scene.sig){scene.sig=sig;buildStaff();scene.bg=null;scene.el.querySelector('.scene-labels').innerHTML=sceneLabels();}
  const live=new Set();
  T.queue.forEach(p=>{live.add(p.id);let sp=scene.ps.get(p.id);
    if(!sp){sp=mkSprite(SPOT.door,patientLook(p));sp.id=p.id;scene.ps.set(p.id,sp);
      sp.plan.push({spot:SPOT.recept,wait:.6});if(p.xray)sp.plan.push({spot:SPOT.xray,wait:1.2});}
    const want=(p.id===T.sel&&!T.result)?'exam':'wait';
    if(sp.want!==want){sp.want=want;
      if(want==='exam'){freeSlot(sp);sp.plan.push({spot:SPOT.examChair});}
      else sp.plan.push({spot:CHAIRS[takeSlot(sp)]});}
    sp.mark=want==='exam';});
  const R=T.result;
  if(R&&R.pid&&scene.ps.has(R.pid)){live.add(R.pid);const sp=scene.ps.get(R.pid);
    if(!sp.done){sp.done=true;sp.mark=false;freeSlot(sp);sp.plan=sp.plan.filter(x=>x.spot!==SPOT.examChair&&!CHAIRS.includes(x.spot));
      treatPlan(R.tids||[]).forEach(s=>sp.plan.push(s));sp.plan.push({spot:SPOT.door,exit:true});
      if((R.tids||[]).some(k=>TX[k].proc)&&scene.doc)scene.doc.plan.push({spot:SPOT.docProc,wait:2.4},{spot:SPOT.doc});}}
  (T.assocLog||[]).forEach(a=>{if(a.seen)return;a.seen=true;let sp=scene.ps.get(a.pid);
    if(!sp){sp=mkSprite(SPOT.door,patientLook(a));sp.id=a.pid;scene.ps.set(a.pid,sp);sp.plan.push({spot:SPOT.recept,wait:.4});}
    live.add(a.pid);
    if(!sp.done){sp.done=true;sp.mark=false;freeSlot(sp);sp.plan=sp.plan.filter(x=>!CHAIRS.includes(x.spot)&&x.spot!==SPOT.examChair);
      sp.plan.push({spot:SPOT.examChair2,wait:1.2});treatPlan(a.tids).forEach(s=>sp.plan.push(s));sp.plan.push({spot:SPOT.door,exit:true});}});
  scene.ps.forEach((sp,id)=>{if(!live.has(id)&&!sp.done){sp.done=true;sp.mark=false;sp.sad=true;freeSlot(sp);sp.plan=[{spot:SPOT.door,exit:true}];sp.path=[];sp.wait=0;}});
}
function mountScene(){
  if(!scene.el){const el=document.createElement('section');el.className='scene';
    el.innerHTML=`<div class="scene-wrap"><canvas width="${SW}" height="${SH}" role="img" aria-label="병원 내부 모습"></canvas><div class="scene-labels"></div></div>`;
    scene.el=el;scene.cv=el.querySelector('canvas');scene.ctx=scene.cv.getContext('2d');scene.ctx.imageSmoothingEnabled=false;requestAnimationFrame(sceneLoop);}
  const st=app.querySelector('.stats');if(st&&st.nextSibling!==scene.el)st.after(scene.el);
  sceneSync();
}

const MORT_RATE=.04,MORT_LTV=.6;
function ensureInv(){
  if(!state.inv)state.inv={px:{},hist:{},hold:{},news:[],used:[],realized:0};
  const I=state.inv;STOCKS.forEach(x=>{if(!I.px[x.id]){I.px[x.id]=x.p0;I.hist[x.id]=[x.p0];}});
  if(!I.dep)I.dep=[];if(!I.dca)I.dca={};if(!I.rate)I.rate=.035;
  if(!state.bld)state.bld={value:25e8,floor:false,own:false,ten:{},offers:{},offerDay:0,mort:0,ownDay:0};
  if(!state.bld.extra){state.bld.extra=[];state.bld.market=[];state.bld.mktDay=0;}
  if(!state.bld.mktDay){state.bld.mktDay=state.day;state.bld.market=[0,1,2].map(()=>newListing());}
}
const tenantsOf=()=>state.bld&&state.bld.own?Object.values(state.bld.ten).filter(Boolean):[];
const hasTen=k=>tenantsOf().some(t=>t.k===k);
function tenantPatients(){let n=0;tenantsOf().forEach(t=>{if(t.k==='pilates')n+=2;if(t.k==='ortho')n+=3;if(t.k==='kmed')n-=1;});return n;}
const tenantRent=()=>tenantsOf().reduce((a,t)=>a+t.rent,0);
const mortInterest=()=>state.bld?Math.round((state.bld.mort+(state.bld.extra||[]).reduce((a,e)=>a+e.mort,0))*MORT_RATE/365):0;
const clinicRent=()=>state.bld&&(state.bld.floor||state.bld.own)?0:Math.max(0,RENT-state.rentDiscount);
const floorPrice=()=>Math.round(state.bld.value*.2/1e6)*1e6;
const bldPrice=(k=1)=>Math.round(state.bld.value*(state.bld.floor?.8:1)*k/1e6)*1e6;
function rollOffers(fl){
  const keys=Object.keys(TENANTS).filter(k=>TENANTS[k].fl.includes(fl)&&!hasTen(k));const out=[];
  while(out.length<2&&keys.length){const k=keys.splice(Math.floor(Math.random()*keys.length),1)[0];const f=R(.85,1.2);
    out.push({k,rent:Math.round(TENANTS[k].rent*f/1e4)*1e4,cred:f>1.08?RI(1,2):RI(2,3)});}
  return out;
}
function buyBuilding(k,loan){
  const B=state.bld,price=bldPrice(k),down=loan?Math.round(price*(1-MORT_LTV)):price;
  if(B.own||state.money<down)return false;
  state.money-=down;if(loan)B.mort+=price-down;B.own=true;B.floor=true;B.ownDay=state.day;B.ten={};B.offers={};B.offerDay=state.day;
  FLOORS.forEach(f=>{B.offers[f]=rollOffers(f);});
  log(`<b>${BLD_NAME}</b> 매입 (${won(price)}${loan?`, 담보대출 ${won(price-down)}`:''})`);return true;
}
/* 뉴스 한 건의 움직임을 주가에 반영. mkt는 모든 종목이 베타만큼 같이 움직여요. */
function applyMove(sid,f){const I=state.inv;if(sid==='mkt')STOCKS.forEach(x=>{I.px[x.id]*=Math.max(.3,1+f*x.beta);});else I.px[sid]*=1+f;}
/* ---------- 예금·적금 ---------- */
const DEP_TERM=28,SAV_WEEKS=8,SAV_BONUS=.01,DEP_PENALTY=.2;
const depRate=()=>state.inv.rate;
function openDeposit(type,amt){
  ensureInv();const I=state.inv;if(state.money<amt)return;
  state.money-=amt;
  I.dep.push(type==='sav'?{type,bal:amt,acc:0,per:amt,left:SAV_WEEKS-1,rate:depRate()+SAV_BONUS,start:state.day,due:state.day+SAV_WEEKS*7}
                         :{type,bal:amt,acc:0,rate:depRate(),start:state.day,due:state.day+DEP_TERM});
  sfx('coin');toast(type==='sav'?`적금 가입: 매주 ${won(amt)} × ${SAV_WEEKS}주`:`정기예금 ${won(amt)} 가입 (${DEP_TERM}일)`);
}
function closeDeposit(i,early){
  const I=state.inv,d=I.dep[i];if(!d)return 0;
  const got=Math.round(d.bal+d.acc*(early?DEP_PENALTY:1));state.money+=got;I.dep.splice(i,1);return got;
}
/* 새 뉴스 한 건을 띄워요. filter로 뉴스 종류를 고를 수 있어요 (골프 동반자 정보용) */
function spawnNews(filter){
  ensureInv();const I=state.inv;const all=NEWS.map((_,i)=>i).filter(i=>!filter||filter(i));if(!all.length)return null;
  const pool=all.filter(i=>!I.used.includes(i));const k=pick(pool.length?pool:all);
  const N=NEWS[k],coin=N.sid==='cc',mk=N.sid==='mkt',good=N.good===null?Math.random()<.5:!!N.good;
  const nm=mk?1:(SMAP[N.sid].nmag||1);
  const hype=mk?0:(coin?R(.05,.2):good?R(.02,.08):R(.06,.15))*nm;
  const mag=mk?R(.04,.1):(coin?R(.3,.7):good?R(.2,.45):R(.25,.45))*nm;
  applyMove(N.sid,hype);
  const n={k,sid:N.sid,good,mag,hype,day:state.day,due:state.day+RI(2,4),done:false};I.news.push(n);
  I.used.push(k);if(I.used.length>12)I.used.shift();
  return n;
}
function stockTick(){
  ensureInv();const I=state.inv,out={hit:[],div:0,fresh:null,matured:[],dca:0};
  const days=Math.max(1,state.day-(I.lastDay||state.day-1));I.lastDay=state.day;
  const mkt=(Math.random()+Math.random()+Math.random()-1.5)*.016;
  STOCKS.forEach(x=>{const g=(Math.random()+Math.random()+Math.random()-1.5)*x.vol*2;I.px[x.id]=Math.max(x.p0*.08,I.px[x.id]*Math.exp(g+mkt*x.beta+x.drift));});
  I.news.forEach(n=>{if(n.done||state.day<n.due)return;n.done=true;const f=n.good?n.mag:-n.mag;applyMove(n.sid,f);n.move=f;
    const N=NEWS[n.k];if(N.rate)I.rate=clamp(I.rate+N.rate,.015,.06);out.hit.push(n);});
  /* 예금·적금 이자 (매일 쌓이고 만기에 받아요) */
  I.dep.forEach(d=>{d.acc+=d.bal*d.rate/365*days;});
  if(dowOf(state.day)===0){
    STOCKS.forEach(x=>{const h=I.hold[x.id];if(x.div&&h&&h.sh>0){const v=Math.round(h.sh*I.px[x.id]*x.div);out.div+=v;state.money+=v;}});
    I.dep.forEach(d=>{if(d.type==='sav'&&d.left>0&&state.money>=d.per){state.money-=d.per;d.bal+=d.per;d.left--;}});
    Object.entries(I.dca).forEach(([id,a])=>{if(a>0&&state.money>=a){const h=I.hold[id]||{sh:0,cost:0};h.sh+=a*(1-STOCK_FEE)/I.px[id];h.cost+=a;I.hold[id]=h;state.money-=a;out.dca+=a;}});
  }
  for(let i=I.dep.length-1;i>=0;i--){const d=I.dep[i];if(state.day>=d.due){const int=Math.round(d.acc);out.matured.push({type:d.type,got:closeDeposit(i,false),int});}}
  if(I.news.filter(n=>!n.done).length<2&&state.day>2&&Math.random()<.45)out.fresh=spawnNews();
  STOCKS.forEach(x=>{const H=I.hist[x.id];H.push(Math.round(I.px[x.id]));if(H.length>30)H.shift();});
  I.news=I.news.filter(n=>!n.done||state.day-n.due<6);
  return out;
}
function bldTick(){
  ensureInv();const B=state.bld;
  B.value=Math.round(B.value*Math.exp((Math.random()+Math.random()-1)*.012+.0006));
  if(B.own&&state.day-B.offerDay>=7){B.offerDay=state.day;FLOORS.forEach(f=>{if(!B.ten[f])B.offers[f]=rollOffers(f);});}
  /* 투자용 건물: 시세·공실·개발 호재 */
  const out=[];
  B.extra.forEach(e=>{const T=EXTRA_T[e.k];e.value=Math.round(e.value*Math.exp((Math.random()+Math.random()-1)*T.vol+T.g));
    if(e.vacUntil&&state.day>=e.vacUntil){e.vacUntil=0;e.occ=1;}
    if(!e.vacUntil&&Math.random()<(T.vac||.006)){e.vacUntil=state.day+RI(5,10);e.occ=.5;out.push(`${e.name}에 공실이 생겼어요 (임대 수입 절반)`);}
    if(e.dev&&state.day>=e.dev.due){if(e.dev.real){e.value=Math.round(e.value*1.35);out.push(`🏗 ${e.name} 개발 호재 확정! 시세 +35%`);}else out.push(`${e.name} 개발 소문은 헛소문이었어요`);e.dev=null;}});
  B.market.forEach(m=>{const T=EXTRA_T[m.k];m.value=Math.round(m.value*Math.exp((Math.random()+Math.random()-1)*T.vol+T.g));
    if(m.dev&&state.day>=m.dev.due){if(m.dev.real)m.value=Math.round(m.value*1.35);m.dev=null;}});
  B.market=B.market.filter(m=>!m.until||state.day<=m.until);
  if(!B.mktDay||state.day-B.mktDay>=14||!B.market.filter(m=>!m.until).length){B.mktDay=state.day;B.market=B.market.filter(m=>m.until).concat([0,1,2].map(()=>newListing()));}
  return out;
}

function buyExtra(id,loan){
  const B=state.bld,m=B.market.find(x=>x.id===id);if(!m)return;const p=listPrice(m),down=loan?Math.round(p*(1-MORT_LTV)):p;
  if(state.money<down)return;state.money-=down;
  B.extra.push({id:m.id,k:m.k,name:m.name,value:m.value,paid:p,mort:loan?p-down:0,occ:1,vacUntil:0,day:state.day,dev:m.dev});
  B.market=B.market.filter(x=>x.id!==id);sfx('level');toast(`${m.name} 매입! 건물 ${B.extra.length+(B.own?1:0)}채의 건물주가 됐어요.`);
  log(`🏙 <b>${m.name}</b> 매입 (${won(p)}${loan?`, 담보대출 ${won(p-down)}`:''})`);
}
function buyStock(id,amt){
  ensureInv();const I=state.inv;amt=Math.min(amt,state.money);if(amt<1e4)return;
  const h=I.hold[id]||{sh:0,cost:0};h.sh+=amt*(1-STOCK_FEE)/I.px[id];h.cost+=amt;I.hold[id]=h;state.money-=amt;
  sfx('buy');toast(`${SMAP[id].name} ${won(amt)} 매수`);
}
function sellStock(id,frac){
  const I=state.inv,h=I.hold[id];if(!h||h.sh<=0)return;
  const sh=h.sh*frac,got=Math.round(sh*I.px[id]*(1-STOCK_FEE)),c=h.cost*frac;
  h.sh-=sh;h.cost-=c;I.realized+=got-c;state.money+=got;if(frac>=1||h.sh*I.px[id]<1)delete I.hold[id];
  sfx('coin');toast(`${SMAP[id].name} ${won(got)} 매도 (${got-c>=0?'+':''}${won(got-c)})`);
}
const stockVal=id=>{const h=state.inv.hold[id];return h?h.sh*state.inv.px[id]:0;};

  if(H.length<2)return'';const mn=Math.min(...H),mx=Math.max(...H),w=120,h=30;
  const pts=H.map((v,i)=>`${(i/(H.length-1)*w).toFixed(1)},${(h-2-(mx>mn?(v-mn)/(mx-mn):.5)*(h-4)).toFixed(1)}`).join(' ');
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${H[H.length-1]>=H[0]?'var(--good)':'var(--bad)'}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;

/* 가상 명화를 도트로 그리기 (24×18 칸) */
function paintArt(c,a,x0,y0,w,h){
  const r=rng(parseInt(a.id.slice(1))*97+11);const cw=w/24,chh=h/18;
  const px=(gx,gy,col)=>{c.fillStyle=col;c.fillRect(Math.floor(x0+gx*cw),Math.floor(y0+gy*chh),Math.ceil(cw),Math.ceil(chh));};
  const fill=(col)=>{for(let y=0;y<18;y++)for(let x=0;x<24;x++)px(x,y,col);};
  const pick=arr=>arr[Math.floor(r()*arr.length)];
  switch(a.style){
    case'landscape':case'snow':{for(let y=0;y<18;y++)for(let x=0;x<24;x++){
        let col=y<8?(a.style==='snow'?['#c9d8e8','#b7c9de'][y%2]:['#9cc9ea','#b7dbf2','#d7ecf7'][Math.min(2,y>>2)]):
          a.style==='snow'?((y<12&&Math.abs(x-12)<(y-6)*1.6)?'#f4f7fa':(y<12?'#7d8fa6':'#e9eef4')):(['#7fb24c','#94c25a','#c9b24a','#6a9a3c'][(x+y*3+((r()*2)|0))%4]);
        px(x,y,col);}
      if(a.style==='snow'){for(let x=0;x<24;x++)for(let y=4;y<12;y++)if(Math.abs(x-12)<(y-4)*1.4&&y<12)px(x,y,y<7?'#ffffff':'#8a9bb2');}
      else{px(19,2,'#ffd34d');px(20,2,'#ffd34d');px(19,3,'#ffd34d');px(20,3,'#ffd34d');for(let i=0;i<4;i++){const tx=2+i*5;px(tx,8,'#2f5a28');px(tx,7,'#3b6e32');px(tx,9,'#4a3524');}}
      break;}
    case'pond':{fill('#3f7a8a');for(let i=0;i<70;i++)px((r()*24)|0,(r()*18)|0,pick(['#5aa0a8','#6fb5a0','#2f6070','#8fc0b0']));
      for(let i=0;i<9;i++){const x=(r()*22)|0,y=(r()*16)|0;px(x,y,'#4f9a4a');px(x+1,y,'#4f9a4a');if(r()<.6)px(x,y-1>0?y-1:y,pick(['#f2a7c3','#ffffff','#f6d36b']));}break;}
    case'night':{fill('#1d2c66');for(let t=0;t<120;t++){const ang=t*.35,rad=t*.06;const x=12+Math.cos(ang)*rad*2.2,y=6+Math.sin(ang)*rad;if(x>=0&&x<24&&y>=0&&y<11)px(x|0,y|0,pick(['#3c5bb0','#6f8fd8','#9fb7ee']));}
      for(let i=0;i<10;i++)px((r()*24)|0,(r()*9)|0,'#f6e27a');px(20,2,'#ffe066');px(21,2,'#ffe066');px(20,3,'#ffe066');

function offWalk(s,dt,area){if(s.wait>0){s.wait-=dt;s.moving=false;return;}
  const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy),v=(REDUCED?999:18)*dt;
  if(d<=v){s.x=s.tx;s.y=s.ty;s.moving=false;s.wait=R(1.5,4);s.tx=R(area[0],area[2]);s.ty=R(area[1],area[3]);}
  else{s.x+=dx/d*v;s.y+=dy/d*v;s.moving=true;if(Math.abs(dx)>.3)s.face=dx<0?-1:1;}}

  const holes=[R(140,190),R(300,380),R(430,490)].map(Math.round).sort(()=>Math.random()-.5).map(d=>({d,par:d<=200?3:d<=400?4:5}));
  const G={holes,h:0,x:0,strokes:0,scores:[],wind:RI(-8,8),club:'dr',lie:'tee',phase:'aim',p:0,a:0,t:0,anim:null,note:'',mate:pick(GOLF_MATES)};
  G.note=`오늘 동반자: <b>${G.mate.name}</b> (${G.mate.desc})`;golfAutoClub(G);return G;
}
const golfLeft=G=>Math.abs(G.holes[G.h].d-G.x);
function golfAutoClub(G){const d=golfLeft(G);G.club=d>230?'dr':d>185?'wd':d>130?'ir':'wg';}
function golfUI(G){
  const hole=G.holes[G.h],d=golfLeft(G),green=G.lie==='green';
  if(G.phase==='done'){hbCtl(`<button class="btn primary" data-h="close">돌아가기</button>`);return;}

}
function golfTap(G){
  if(G.phase==='aim'){G.t=0;G.phase=G.lie==='green'?'putt':'power';G.note=G.lie==='green'?'게이지를 남은 거리에 맞춰 멈추세요. (눈금 5m 간격)':'파워 게이지를 원하는 곳에서 멈추세요.';golfUI(G);return;}
  if(G.phase==='power'){G.p=golfPow(G.t);G.t=0;G.phase='acc';G.note='가운데 초록 칸에 가까울수록 정확해요!';golfUI(G);return;}
  if(G.phase==='acc'){G.a=Math.sin(G.t*5.2);golfShot(G);golfUI(G);return;}
  if(G.phase==='putt'){G.p=golfPow(G.t*.8);golfPutt(G);golfUI(G);return;}
  if(G.phase==='holed'){if(G.cele&&G.cele.t<.8)return;G.cele=null;if(G.h<G.holes.length-1){G.h++;G.x=0;G.strokes=0;G.lie='tee';G.wind=RI(-8,8);G.phase='aim';golfAutoClub(G);G.note=`${G.h+1}번 홀 · 파 ${G.holes[G.h].par} · ${G.holes[G.h].d}m`;}else golfFinish(G);golfUI(G);}
}
const golfPow=t=>1-Math.abs((t*1.1)%2-1);
function golfShot(G){
  const hole=G.holes[G.h],cl=CLUBS.find(c=>c[0]===G.club);let max=cl[2];if(G.lie==='rough')max*=.8;if(G.lie==='bunker')max*=.6;
  const err=Math.abs(G.a);let dist=Math.max(5,max*G.p*(1-.35*err)+G.wind*(max/250));G.strokes++;let note='';
  if(err>.93){G.strokes++;dist=0;note='OB! 1벌타를 받고 같은 자리에서 다시 쳐요.';}
  else G.lie=err>.6?(Math.random()<.5?'rough':'bunker'):'fair';
  const dir=G.x<=hole.d?1:-1,from=G.x;G.x=Math.max(0,G.x+dist*dir);
  let left=golfLeft(G);
  if(dist>0&&left<=1.2){G.x=hole.d;left=0;note=G.strokes===1?'🎉 홀인원!!!':'칩인 버디 찬스… 들어갔어요!';}
  else if(dist>0&&left<=25)G.lie='green';
  G.anim={from,to:G.x,t:0};G.phase='fly';
  G.note=note||`${Math.round(dist)}m 날아갔어요. ${G.lie==='rough'?'러프에 빠졌어요 (다음 샷 -20%)':G.lie==='bunker'?'벙커! (다음 샷 -40%)':G.lie==='green'?'그린 위에 올라갔어요!':''}`;
  sfx(dist>0?'click':'bad');
}
function golfPutt(G){
  const left=golfLeft(G),need=Math.min(1,left/25),err=G.p-need;G.strokes++;
  const miss=Math.abs(err)*25;const from=G.x,hole=G.holes[G.h];
  if(miss<=.8){G.x=hole.d;G.note='땡그랑! 홀컵에 쏙 들어갔어요.';sfx('coin');}
  else{const dir=G.x<=hole.d?1:-1;G.x=hole.d-dir*(err>0?-1:1)*miss;G.note=err>0?`너무 셌어요. ${miss.toFixed(1)}m 지나갔어요.`:`짧았어요. ${miss.toFixed(1)}m 남았어요.`;}
  G.anim={from,to:G.x,t:0};G.phase='fly';
}
function golfAfterFly(G){

/* ===== 피아노 (리듬 게임) ===== */
const P_UNIT=.3,P_LEAD=2.2,P_FALL=1.6,P_HITY=340;
function pianoNew(opt,keepSong){
  const P=ensureHobby().piano,concert=opt==='concert';
  /* 연주회는 열린 난이도 중 가장 어려운 걸로 */
  const si=concert?[2,1,0].find(i=>songOpen(i)):clamp(+opt||0,0,2),unit=SONGS[si].unit;
  let k=keepSong;if(k==null){const pool=PSONGS.map((_,i)=>i).filter(i=>i!==P.last);k=pick(pool);}P.last=k;
  musicStop();
  const notes=[],bass=[];let t=P_LEAD,u=0;
  songSeq(PSONGS[k]).forEach(([m,len])=>{if(m!=null){notes.push({t,m,len,hit:null});if(u%6===0||len>=4)bass.push({t,m:m-24,done:false});}t+=len*unit;u+=len;});
  /* 칸 배정: 음 높이 순서대로 4칸에 고르게 */
  const ps=[...new Set(notes.map(n=>n.m))].sort((a,b)=>a-b);
  notes.forEach(n=>{n.lane=clamp(Math.floor(ps.indexOf(n.m)/ps.length*4),0,3);});
  return{opt,si,k,unit,concert,notes,bass,t:0,score:0,combo:0,maxCombo:0,judge:'',jt:0,flash:[0,0,0,0],end:notes[notes.length-1].t+1.6,done:false};
}
function pianoUI(G){
  const s=SONGS[G.si],song=PSONGS[G.k];
  if(G.done){hbCtl(G.concert?`<button class="btn primary" data-h="close">돌아가기</button>`
    :`<button class="btn" data-h="again">같은 곡 다시</button><button class="btn" data-h="next">다른 곡</button><button class="btn primary" data-h="close">돌아가기</button>`);return;}
  hbMsg(`${G.concert?'🎤 대기실 연주회':'연습'} · ${s.name} · <b>${song.name}</b> <small>(${song.by})</small><br>화면의 칸을 탭하세요 (키보드 D F J K)`);hbCtl('');
}
function pianoTap(G,e){const r=HB.cv.getBoundingClientRect();const lane=clamp(Math.floor((e.clientX-r.left)/r.width*4),0,3);pianoHit(G,lane);}
function pianoHit(G,lane){
  if(!G||G.done)return;G.flash[lane]=.15;let best=null;
  G.notes.forEach(n=>{if(n.hit===null&&n.lane===lane){const d=Math.abs(n.t-G.t);if(d<.22&&(!best||d<Math.abs(best.t-G.t)))best=n;}});
  if(!best)return;const d=Math.abs(best.t-G.t);
  if(d<.075){best.hit=100;G.judge='PERFECT';}else if(d<.15){best.hit=60;G.judge='GOOD';}else{best.hit=0;G.judge='MISS';}
  if(best.hit){G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);if(Snd.ctx)voice(mtof(best.m+12),Snd.ctx.currentTime,G.unit*best.len+.5,{type:'triangle',vol:.09,attack:.004,dest:Snd.music,filter:3600});}else G.combo=0;
  G.jt=.5;
}
function pianoStep(G,dt){
  if(!G.done){G.t+=dt;
    G.bass.forEach(b=>{if(!b.done&&G.t>=b.t){b.done=true;if(Snd.ctx)voice(mtof(b.m),Snd.ctx.currentTime,G.unit*6,{type:'sine',vol:.08,attack:.01,dest:Snd.music,filter:500});}});
    G.notes.forEach(n=>{if(n.hit===null&&G.t>n.t+.22){n.hit=0;G.combo=0;G.judge='MISS';G.jt=.5;}});
    if(G.t>G.end)pianoFinish(G);}

  pianoDraw(G);

function pianoFinish(G){

  if(G.si<SONGS.length-1&&prev<SONGS[G.si+1].need&&pct>=SONGS[G.si+1].need)msg+=`<br>🔓 새 난이도가 열렸어요: ${SONGS[G.si+1].name}`;

    if(gr==='S'||gr==='A'){state.rating=clamp(state.rating+(gr==='S'?.05:.03),1,5);addMod(gr==='S'?3:2,5,'원장님 연주회');msg+=`<br>👏 대기실이 박수로 가득! 평점 +${gr==='S'?'0.05':'0.03'}, 5일 동안 하루 환자 +${gr==='S'?3:2}명`;sfx('level');G.toast='연주회 대성공!';}
    else msg+='<br>연주회는 무난하게 끝났어요. 다음엔 A등급 이상을 노려봐요!';
    log(`🎹 대기실 연주회 ${gr}등급 (${pct}점)`);}
  hbMsg(msg);pianoUI(G);save();
}
function pianoDraw(G){

  if(G.jt>0)cvText(c,G.judge,W/2,170,{size:26,col:G.judge==='PERFECT'?'#e0b23a':G.judge==='GOOD'?'#6fd88a':'#e0362b',align:'center',bold:true});
  if(G.combo>2)cvText(c,`${G.combo} 콤보`,W/2,200,{size:14,align:'center'});
  const prog=clamp(G.t/G.end,0,1);c.fillStyle='#3a2c1c';c.fillRect(0,0,W,4);c.fillStyle='#e0b23a';c.fillRect(0,0,W*prog,4);

/* ---------- 소리: 잔잔한 배경음악 + 효과음 (WebAudio로 직접 합성) ---------- */
const Snd={ctx:null,master:null,music:null,sfx:null};
const Music={timer:null,next:0,step:0};
function audioInit(){
  if(Snd.ctx)return true;
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
  try{Snd.ctx=new AC();}catch(e){return false;}
  const c=Snd.ctx;const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.005;comp.release.value=.2;comp.connect(c.destination);
  Snd.master=c.createGain();Snd.master.gain.value=1.5;Snd.master.connect(comp);
  Snd.music=c.createGain();Snd.music.gain.value=1.6;Snd.music.connect(Snd.master);
  Snd.sfx=c.createGain();Snd.sfx.gain.value=1.4;Snd.sfx.connect(Snd.master);
  return true;
}
const audioPref=()=>state&&state.audio?state.audio:{music:true,sfx:true};
function audioUnlock(){if(!audioInit())return;if(Snd.ctx.state==='suspended')Snd.ctx.resume().catch(()=>{});if(audioPref().music&&!(typeof HB!=='undefined'&&HB.kind==='piano'))musicStart();}
document.addEventListener('pointerdown',audioUnlock,true);
document.addEventListener('visibilitychange',()=>{if(!Snd.ctx)return;if(document.hidden)Snd.ctx.suspend().catch(()=>{});else Snd.ctx.resume().catch(()=>{});});
const mtof=m=>440*Math.pow(2,(m-69)/12);
function voice(freq,t,dur,{type='sine',vol=.2,attack=.01,dest,filter=2400}={}){
  const c=Snd.ctx;if(!c)return;const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
  o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=filter;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(dest||Snd.sfx);o.start(t);o.stop(t+dur+.05);
}
/* 지브리풍 3/4 왈츠: 하행 코드 진행 + 직접 작곡한 8마디 멜로디 (플루트 ↔ 피아노) */

};
const SONG=[['I','none',0,0,0],['A','flute',0,1,0],['A','piano',0,1,1],['B','flute',0,1,0],['B','piano',12,1,2],
            ['C','piano',0,1,1],['A','both',0,1,2],['A','flute',12,1,0],['B','both',0,1,1],['I','none',0,1,2]];
const BARS=[];SONG.forEach(([k,lead,oct,str,pat])=>SEC[k].ch.forEach((ch,i)=>BARS.push({ch,mel:SEC[k].mel[i],lead,oct,str,pat})));
function flute(freq,t,dur,vol){const c=Snd.ctx,o=c.createOscillator(),l=c.createOscillator(),lg=c.createGain(),g=c.createGain(),f=c.createBiquadFilter();
  o.type='sine';o.frequency.value=freq;l.frequency.value=5.2;lg.gain.value=freq*.006;l.connect(lg);lg.connect(o.frequency);
  f.type='lowpass';f.frequency.value=2600;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.09);g.gain.setValueAtTime(vol*.85,t+Math.max(.1,dur-.15));g.gain.exponentialRampToValueAtTime(.0001,t+dur+.25);
  o.connect(f);f.connect(g);g.connect(Snd.music);o.start(t);l.start(t);o.stop(t+dur+.3);l.stop(t+dur+.3);}
function strings(notes,t,dur){const c=Snd.ctx;notes.forEach(m=>[-6,6].forEach(dt=>{const o=c.createOscillator(),g=c.createGain(),f=c.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=dt;f.type='lowpass';f.frequency.value=950;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.009,t+.7);g.gain.setValueAtTime(.009,t+dur-.3);g.gain.linearRampToValueAtTime(0,t+dur+.4);
  o.connect(f);f.connect(g);g.connect(Snd.music);o.start(t);o.stop(t+dur+.5);}));}
function musicStart(){if(!Snd.ctx||Music.timer)return;Music.next=Snd.ctx.currentTime+.15;Music.step=0;Music.timer=setInterval(musicSched,120);}
function musicStop(){clearInterval(Music.timer);Music.timer=null;}
function musicSched(){
  const c=Snd.ctx;if(!c||c.state!=='running')return;const e=.24;
  const piano=state&&state.office&&state.office.furn&&state.office.furn.piano;
  while(Music.next<c.currentTime+.6){
    const s=Music.step,t=Music.next,bar=BARS[Math.floor(s/6)%BARS.length],ch=bar.ch,pos=s%6,D=Snd.music;
    if(pos===0){voice(mtof(ch.b),t,e*6,{type:'sine',vol:.09,attack:.01,dest:D,filter:500});if(bar.str)strings(ch.t.slice(1).map(m=>m+12),t,e*6);}
    if(bar.pat===2){if(pos===2||pos===4)ch.t.slice(1).forEach(m=>voice(mtof(m+12),t,e*1.1,{type:'triangle',vol:.025,attack:.004,dest:D,filter:2600}));}
    else{const arp=bar.pat===0?[ch.b+12,ch.t[1],ch.t[2],ch.t[3],ch.t[2],ch.t[1]]:[ch.b+12,ch.t[2],ch.t[3],ch.t[1]+12,ch.t[3],ch.t[2]];
      voice(mtof(arp[pos]),t,e*2.2,{type:'triangle',vol:pos===0?.06:.04,attack:.004,dest:D,filter:2400});}
    bar.mel.forEach(([m,st,len])=>{if(st!==pos)return;const mm=m+bar.oct;const lead=bar.lead==='flute'&&piano?'piano':bar.lead;
      if(len>=3&&Math.random()<.25)voice(mtof(mm+2),t-.07,.12,{type:'sine',vol:.025,attack:.004,dest:D,filter:2600});
      if(lead==='flute'||lead==='both')flute(mtof(mm),t,e*len,.05);
      if(lead==='piano')voice(mtof(bar.oct?mm:mm+12),t,e*len+.4,{type:'triangle',vol:.06,attack:.004,dest:D,filter:3600});
      if(lead==='both'){const h=Math.max(...ch.t.flatMap(v=>[v+12,v+24]).filter(v=>v<mm-2));voice(mtof(h),t,e*len+.3,{type:'triangle',vol:.035,attack:.004,dest:D,filter:3000});}});
    Music.next+=e;Music.step++;
  }
}
function sfx(name,arg){
  if(!Snd.ctx||!audioPref().sfx||Snd.ctx.state!=='running')return;const t=Snd.ctx.currentTime;
  switch(name){
    case'click':voice(880,t,.05,{type:'triangle',vol:.05});break;
    case'coin':voice(988,t,.09,{type:'square',vol:.05,filter:3000});voice(1319,t+.07,.22,{type:'square',vol:.05,filter:3000});break;
    case'stars':{const n=arg||3;for(let i=0;i<n;i++)voice(mtof(72+[0,4,7,12,16][i]),t+.12+i*.09,.3,{type:'triangle',vol:.07});break;}
    case'bad':voice(330,t,.18,{type:'sawtooth',vol:.04,filter:900});voice(247,t+.15,.3,{type:'sawtooth',vol:.04,filter:900});break;
    case'bell':voice(1046,t,1.2,{type:'sine',vol:.06});voice(1568,t,.8,{type:'sine',vol:.025});break;
    case'level':[60,64,67,72,76,79].forEach((m,i)=>voice(mtof(m+12),t+i*.07,.35,{type:'triangle',vol:.07}));break;
    case'buy':voice(1568,t,.08,{type:'square',vol:.04,filter:4000});voice(2093,t+.08,.4,{type:'sine',vol:.07});break;
    case'chime':[72,76,79,84].forEach((m,i)=>voice(mtof(m),t+i*.18,1.2,{type:'sine',vol:.06}));break;
    case'fanfare':[67,72,76,79].forEach((m,i)=>voice(mtof(m),t+i*.1,.25,{type:'square',vol:.04,filter:3000}));[72,76,79,84].forEach(m=>voice(mtof(m),t+.42,1.1,{type:'triangle',vol:.06,filter:3600}));break;
    case'splash':{const c=Snd.ctx,n=c.sampleRate*.35,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
      const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1400;g.gain.value=.35;s.connect(f);f.connect(g);g.connect(Snd.sfx);s.start(t);break;}
  }
}

/* ---------- boot ---------- */
/* 스토어 스크린샷용 데모 화면 (?shot=1~5). 저장하지 않음 */
function setupShot(n){
  const gold=n===3||n===4;newGame('김원장 통증의학과',gold?'gold':'normal');state.modal=null;state.mode='quick';state.audio={music:false,sfx:false};
  Object.assign(state,{day:24,rating:4.62,level:8,xp:120,titleIdx:3,totalTreated:640});
  if(gold){state.auto=true;state.autoSpeed=8;for(let i=0;i<400&&state.day<30;i++){if(state.modal&&state.modal.type==='event')chooseEvent(0);autoTick();if(state.modal&&state.modal.type!=='event')state.modal=null;}}
  state.today=null;startDay();if(state.modal){state.today.pending=false;state.modal=null;genArrivals();}
  advance(gold?260:120);
  if(!gold){let p;do{p=genPatient(state.today.time-12,state.today);}while(!(p.dx==='lumbar'&&p.vas>=6&&!p.conservative));p.xray=true;p.arrive=state.today.time-12;
    state.today.queue.unshift(p);state.today.sel=p.id;const C=DDX.lumbar;
    if(n===1||n===5){p.picks=[C[0],C[1]];p.txSel=['tfeb','med'];}
    if(n===2){p.picks=[C[0],C[1],C[2]];treatMulti(['tfeb','med','pt']);}}
  if(n===4){ensureOffice();FURN.forEach(f=>state.office.furn[f.k]=true);state.office.art=[{id:'a7',paid:2.2e8},{id:'a4',paid:1.6e7},{id:'a3',paid:1.2e8}];
    state.office.wall=['a7','a4','a3'];state.office.lobby='a4';state.officeTab='mine';state.modal={type:'office'};}
  document.body.classList.add('shot');
  if(n===1||n===2||n===5)document.body.classList.add('shot-room');
  if(n===5)document.body.classList.add('shot-tx');
  render();
}
function boot(data){
  if(SHOT){setupShot(+SHOT);return;}
  state=(data&&data.state)||load();
  if(!state){newGame('김원장 통증의학과');state.modal={type:'intro'};}
  if(!Array.isArray(state.returning))state.returning=[];
  STAFF.forEach(x=>{if(typeof state.staff[x.k]!=='number')state.staff[x.k]=0;});
  Object.keys(GROW).forEach(k=>{if(typeof state[k]!=='number')state[k]=0;});
  if(!state.audio)state.audio={music:true,sfx:true};
  ensureOffice();
  const fixDx=p=>{if(p&&p.dx==='mps')p.dx='discNeck';};
  state.returning.forEach(r=>fixDx(r.base));
  if(state.today){state.today.queue.forEach(fixDx);state.today.arrivals.forEach(fixDx);}
  if(state.today){state.today.grading=null;state.today.aiError='';
    if(state.today.result&&!state.today.result.tids){state.today.result=null;if(state.today.queue.length)state.today.sel=state.today.queue[0].id;}}
  render();
}
try{window.claude?.hot?.snapshot?.(()=>({state}));}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
